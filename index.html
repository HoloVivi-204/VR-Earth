<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="VR Earth Core - optimized interactive Earth and admin-lite space view"
  />
  <title>VR Earth Core</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app"></div>

  <div class="hud">
    <div class="panel">
      <span class="label">Mode</span>
      <button id="modeToggleBtn" class="mode-btn">
        <span class="mode-text">Natural</span>
      </button>
    </div>

    <div class="panel">
      <span class="label">Rotation</span>
      <div class="inline-controls">
        <button id="speedDownBtn" class="small-btn" aria-label="Slower">-</button>
        <span id="speedValue" class="value">240x</span>
        <button id="speedUpBtn" class="small-btn" aria-label="Faster">+</button>
        <button id="pauseBtn" class="small-btn" aria-label="Pause rotation">Pause</button>
      </div>
    </div>

    <div class="panel">
      <span class="label">Views</span>
      <div class="inline-controls">
        <button class="chip-btn active" data-view="overview">Overview</button>
        <button class="chip-btn" data-view="equator">Equator</button>
        <button class="chip-btn" data-view="polar">Polar</button>
      </div>
    </div>

    <div class="panel">
      <span class="label">VR</span>
      <button id="vrButton" class="vr-btn">
        <span id="vrLabel">Enter VR</span>
      </button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
